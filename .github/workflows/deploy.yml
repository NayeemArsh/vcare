name: Deploy Worker
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler --allow-scripts=esbuild,workerd

      - name: Deploy to Cloudflare
        run: |
          npx wrangler deploy worker.mjs --config wrangler.toml \
            --var TELEGRAM_BOT_TOKEN:"$TELEGRAM_BOT_TOKEN" \
            --var TELEGRAM_CHAT_ID:"$TELEGRAM_CHAT_ID" \
            --var DHAN_ACCESS_TOKEN:"$DHAN_ACCESS_TOKEN" \
            --var DHAN_CLIENT_ID:"$DHAN_CLIENT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
